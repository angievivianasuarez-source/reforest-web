services:
  reforest-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_SERVICIOS_URL: ${VITE_API_SERVICIOS_URL:-https://reforestapi.codeconheiner.com}
        VITE_API_AUTH_URL: ${VITE_API_AUTH_URL:-https://auth.codeconheiner.com}
    container_name: reforest-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
